[project]
name = "openmetadata-governance-portal-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "cryptography>=42,<47",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.4,<3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
